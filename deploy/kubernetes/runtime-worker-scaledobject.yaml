apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ehf-runtime-worker
spec:
  scaleTargetRef:
    name: ehf-runtime-worker
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
  triggers:
    - type: postgresql
      metadata:
        connectionFromEnv: KEDA_DATABASE_URL
        targetQueryValue: "4"
        activationTargetQueryValue: "1"
        query: >-
          select count(*) from harness_runtime.runs
          where status in ('queued','retrying')
          and (available_at is null or available_at <= now())
