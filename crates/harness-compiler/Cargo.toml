[package]
name = "harness-compiler"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "harnessc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
lgir-core = { git = "https://github.com/hganesha/ladder-graph.git", rev = "fec01bf0fa5ff259c071439d63ad71c9979668f9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
walkdir = "2.5"
