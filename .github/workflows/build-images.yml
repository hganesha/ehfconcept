# Build both images in ACR and resolve them to digests.
#
# Builds run remotely with `az acr build`, so the runner needs no Docker and the
# registry needs no admin credential. The digests, not the tags, are what every
# later stage consumes: a tag can be moved, a digest cannot.
name: build-images

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub environment whose registry receives the images'
        type: environment
        required: true
        default: poc
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
    outputs:
      images:
        description: 'JSON object mapping each service to its digest-pinned image'
        value: ${{ jobs.build.outputs.images }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: build and pin
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      images: ${{ steps.pin.outputs.images }}
    steps:
      - uses: actions/checkout@v5

      # Fail with a readable message rather than inside azure/login, which
      # reports a missing variable as an authentication error.
      - name: check environment configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
        run: |
          set -euo pipefail
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_CONTAINER_REGISTRY; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing environment variables: ${missing[*]}" >&2
            echo "Set them on the GitHub environment; see infra/README.md." >&2
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: resolve registry
        id: registry
        run: |
          set -euo pipefail
          login_server="$(az acr show -n "${{ vars.AZURE_CONTAINER_REGISTRY }}" \
            --query loginServer -o tsv)"
          echo "login-server=${login_server}" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The Dockerfile prunes the workspace per service with SERVICE_FILTER and
      # bakes in the Rust compiler of record, so each service gets its own image
      # rather than one image serving every workload.
      - name: build service images
        run: |
          set -euo pipefail
          build() {
            local repo="$1" filter="$2" filter2="${3:-}"
            local args=(--registry "${{ vars.AZURE_CONTAINER_REGISTRY }}"
                        --platform linux/amd64
                        --image "ehf/${repo}:${{ steps.registry.outputs.tag }}"
                        --file Dockerfile
                        --build-arg "SERVICE_FILTER=${filter}")
            [[ -n "$filter2" ]] && args+=(--build-arg "SERVICE_FILTER_2=${filter2}")
            echo "::group::${repo}"
            az acr build "${args[@]}" .
            echo "::endgroup::"
          }

          build migrate      "@ehf/persistence..."        "@ehf/case-store..."
          build control-api  "@ehf/control-api..."
          build case-api     "@ehf/case-api..."
          build gateway      "@ehf/capability-gateway..."
          build runtime-host "@ehf/runtime-host..."
          build dispatcher   "@ehf/runtime-worker..."

      - name: build control surface image
        run: |
          az acr build --registry "${{ vars.AZURE_CONTAINER_REGISTRY }}" \
            --platform linux/amd64 \
            --image "ehf/control-ui:${{ steps.registry.outputs.tag }}" \
            --file Dockerfile.ui .

      - name: pin digests
        id: pin
        run: |
          set -euo pipefail
          images='{}'
          for repo in migrate control-api case-api gateway runtime-host dispatcher control-ui; do
            digest="$(az acr repository show \
              -n "${{ vars.AZURE_CONTAINER_REGISTRY }}" \
              --image "ehf/${repo}:${{ steps.registry.outputs.tag }}" \
              --query digest -o tsv)"
            ref="${{ steps.registry.outputs.login-server }}/ehf/${repo}@${digest}"
            images="$(jq -c --arg k "$repo" --arg v "$ref" '. + {($k): $v}' <<<"$images")"
            printf '%-14s %s\n' "$repo" "$digest"
          done
          echo "images=${images}" >> "$GITHUB_OUTPUT"

          {
            echo '## Images'
            echo
            echo "| Service | Image |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | `\(.value)` |"' <<<"$images"
          } >> "$GITHUB_STEP_SUMMARY"

      # The promotion unit from the migration plan, section 10. Promote this
      # file between environments; rebuilding produces a different artifact and
      # is not promotion.
      - name: write release manifest
        run: |
          set -euo pipefail
          jq -n \
            --arg sourceRevision "${{ github.sha }}" \
            --arg runId "${{ github.run_id }}" \
            --argjson images '${{ steps.pin.outputs.images }}' \
            '{
               sourceRevision: $sourceRevision,
               buildRunId: $runId,
               serviceImages: $images,
               runtimeProvider: "local_http",
               platformMode: "local",
               foundryAgent: null
             }' > release-manifest.json
          cat release-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
